name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by deploy.yml, which calls this workflow
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # mongodb-memory-server downloads a MongoDB binary on first use; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:tz
      - run: npm run build -w @vs/web
