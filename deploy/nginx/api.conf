# /etc/nginx/conf.d/api.conf — reverse proxy for the API on the EC2 instance.
# Replace api.example.com with the real API host (api.<domain>) before installing.
# Certificates come from: certbot certonly --webroot -w /var/www/certbot -d api.example.com

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Let's Encrypt HTTP-01 challenges.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # JSON bodies only (files go straight to S3); the API itself caps bodies at 1 MB.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts exactly one proxy hop (app.set('trust proxy', 1)).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
